server:
  port: 8086

spring:
  application:
    name: traveler-payment
  datasource:
    url: jdbc:mysql://localhost:3306/traveler_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

payhere:
  merchant:
    id: "121XXXX"  # PayHere Sandbox Merchant ID
    secret: "sandbox_secret_key_here"  # PayHere Sandbox Secret
    # Your business bank account details (configured in PayHere dashboard)
    business:
      bank: "Commercial Bank"
      account: "Your Business Account Number"
      holder: "Your Business Name"
      branch: "Your Branch Code"
  api:
    base-url: https://sandbox.payhere.lk
    checkout-url: https://sandbox.payhere.lk/pay/checkout
  notify:
    url: http://localhost:8086/api/webhooks/payhere
  return:
    url: http://localhost:3000/payment/success
  cancel:
    url: http://localhost:3000/payment/failed

logging:
  level:
    com.traveler.payment: DEBUG

app:
  commission:
    platform-rate: 0.05  # 5% platform commission
  bank:
    business-account: "YOUR_BUSINESS_ACCOUNT_NUMBER"
    api:
      enabled: false  # Set to true when bank API is configured
      endpoint: "https://api.yourbank.lk/transfers"
      auth-token: "your_bank_api_token"