spring:
  application:
    name: traveler-gateway
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://traveler-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader
        - id: core-service
          uri: lb://traveler-core
          predicates:
            - Path=/core/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
server:
  port: 5555
