spring:
  application:
    name: traveler-gateway
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader
        - id: core-service
          uri: http://localhost:8084
          predicates:
            - Path=/core/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader
server:
  port: 5555
